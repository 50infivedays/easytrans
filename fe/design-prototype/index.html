<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebDrop — UI Redesign Prototype</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@500;600&family=Outfit:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-state="idle">
  <div class="ambient" aria-hidden="true"></div>

  <div class="app-shell">
    <header class="nav">
      <div class="nav-inner">
        <a class="brand" href="#">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/>
            </svg>
          </span>
          <span class="brand-name">WebDrop</span>
        </a>
        <div class="nav-actions">
          <a class="nav-link" href="#">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1V9.5z"/></svg>
            <span data-i18n="navHome">首页</span>
          </a>
          <a class="nav-link" href="#">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 004 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
            <span data-i18n="navBlog">博客</span>
          </a>
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" class="lang-btn active" data-lang="zh">中文</button>
            <button type="button" class="lang-btn" data-lang="en">EN</button>
          </div>
        </div>
      </div>
    </header>

    <main class="workspace">
      <!-- Identity: desktop = left rail card; mobile = compact sticky strip -->
      <section class="panel panel-identity" aria-label="Your connection code">
        <div class="panel-header panel-identity-desktop">
          <p class="panel-label" data-i18n="myId">你的连接码</p>
          <h2 class="panel-title" id="uid-heading">A3F92K</h2>
        </div>
        <div class="panel-body uid-block">
          <div class="uid-top">
            <p class="panel-label uid-mobile-label" data-i18n="myId">你的连接码</p>
            <div class="uid-row">
              <div class="uid-code" id="uid-display" aria-label="Connection code">A3F92K</div>
              <div class="uid-actions uid-actions-inline">
                <button type="button" class="btn btn-primary btn-copy-compact" id="btn-copy" data-i18n="copy">复制</button>
                <button type="button" class="btn btn-ghost btn-icon-only" id="btn-qr-toggle" aria-expanded="false" aria-controls="qr-drawer" title="QR">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h3v3M17 17h3v3M14 17h3M17 14v3"/></svg>
                </button>
              </div>
            </div>
          </div>
          <details class="qr-drawer" id="qr-drawer">
            <summary class="sr-only" data-i18n="showQr">显示二维码</summary>
            <div class="qr-wrap">
              <div class="qr-frame">
                <canvas id="qr-canvas" width="120" height="120" role="img" aria-label="QR code"></canvas>
              </div>
              <p class="qr-hint" data-i18n="scanHint">让对方扫描以发起连接</p>
            </div>
          </details>
        </div>
        <div class="status-row status-row-inline" role="status" aria-live="polite">
          <span class="pill ok" id="pill-ws">
            <span class="pill-dot"></span>
            <span data-i18n="ws">信令</span>
            <span class="pill-text">已连接</span>
          </span>
          <span class="pill" id="pill-rtc">
            <span class="pill-dot"></span>
            <span data-i18n="rtc">P2P</span>
            <span class="pill-text">未连接</span>
          </span>
        </div>
      </section>

      <div class="canvas">
        <header class="hero-compact">
          <h1>WebDrop</h1>
          <p data-i18n="subtitle">浏览器内 P2P 传文件与聊天，数据不经服务器存储。</p>
        </header>

        <section class="panel connect-panel connect-panel-primary">
          <div class="panel-header">
            <p class="panel-label connect-idle-hint">Step 1</p>
            <h2 class="panel-title" data-i18n="connectLabel">对方连接码</h2>
          </div>
          <div class="panel-body">
            <div class="connect-row connect-idle-hint">
              <div class="input-wrap">
                <label class="input-label" for="peer-input" data-i18n="connectLabel">对方连接码</label>
                <input
                  id="peer-input"
                  class="input-field"
                  type="text"
                  maxlength="6"
                  autocomplete="off"
                  spellcheck="false"
                  placeholder="输入 6 位码"
                />
              </div>
              <div class="connect-actions">
                <button type="button" class="btn btn-primary" id="btn-connect" data-i18n="connect">连接</button>
                <button type="button" class="btn btn-ghost" data-i18n="scan">扫码</button>
              </div>
            </div>
          </div>
        </section>

        <section class="panel chat-panel">
          <div class="panel-header chat-panel-header">
            <p class="panel-label chat-step-label">Step 2</p>
            <h2 class="panel-title" data-i18n="chatTitle">传输与对话</h2>
          </div>
          <div class="panel-body chat-panel-body">
            <div class="chat-idle empty-chat" aria-hidden="false">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
              </svg>
              <p data-i18n="chatEmpty">连接成功后，消息与文件将在此出现</p>
            </div>

            <div class="chat-connected">
              <div class="chat-header-meta">
                <span class="peer-tag"><span data-i18n="peerConnected">已与</span> <code id="peer-display">B7K2M1</code></span>
                <button type="button" class="btn btn-ghost btn-disconnect" id="btn-disconnect" data-i18n="disconnect">断开</button>
              </div>
              <div class="messages" id="messages" role="log" aria-live="polite">
                <div class="msg them">
                  <div class="msg-bubble">
                    你好，我准备发一份设计稿。
                    <span class="msg-time">14:32</span>
                  </div>
                </div>
                <div class="msg me">
                  <div class="msg-bubble">
                    收到，直接拖进来即可。
                    <span class="msg-time">14:33</span>
                  </div>
                </div>
              </div>
              <div class="transfer-item" aria-label="File transfer in progress">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15l3 3 3-3"/></svg>
                <div style="flex:1;min-width:0;">
                  <div style="font-weight:600;truncate">design-v2.fig</div>
                  <div class="progress-track"><div class="progress-fill" style="width:68%"></div></div>
                </div>
                <span style="font-variant-numeric:tabular-nums;color:var(--ink-subtle)">68%</span>
              </div>
              <div class="composer">
                <input id="chat-input" class="input-field" type="text" data-i18n="chatPlaceholder" placeholder="输入消息，或粘贴图片…" />
                <button type="button" class="btn btn-primary btn-icon" aria-label="Send">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                </button>
                <button type="button" class="btn btn-ghost btn-icon" aria-label="Attach file">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
                </button>
              </div>
            </div>
          </div>
        </section>
      </div>

      <details class="panel panel-trust panel-trust-collapse">
        <summary class="trust-summary">
          <span data-i18n="trustTitle">为何值得信任</span>
          <svg class="trust-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </summary>
        <div class="panel-body trust-body" data-trust-heading="为何值得信任">
          <h2 class="trust-desktop-title" data-i18n="trustTitle">为何值得信任</h2>
          <ul class="trust-list" id="trust-list"></ul>
        </div>
      </details>
    </main>

    <footer class="footer">
      <div class="footer-inner">
        <span>© 2025 WebDrop</span>
        <nav class="footer-links" aria-label="Legal">
          <a href="#">隐私政策</a>
          <a href="#">服务条款</a>
        </nav>
      </div>
    </footer>
  </div>

  <!-- Prototype-only: toggle connection states for review -->
  <div class="demo-bar" role="toolbar" aria-label="Prototype state switcher">
    <span>原型演示</span>
    <button type="button" id="demo-idle" class="active">未连接</button>
    <button type="button" id="demo-connected">已连接</button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/main.js"></script>
</body>
</html>
